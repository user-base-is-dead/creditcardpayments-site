<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="CreditCardPay">
  <title>CreditCardPay</title>
  <!-- Full-bleed circle: maximises the mark at 16px tab size. -->
  <circle cx="16" cy="16" r="16" fill="url(#logo-grad)" />
  <!-- Double chevron brand mark. Strokes are heavier than the 32px navbar
       version so the shape still reads once the browser scales to 16px. -->
  <path d="M12 10L16 16L12 22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M17 10L21 16L17 22" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.65" />
  <defs>
    <linearGradient id="logo-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
</svg>
